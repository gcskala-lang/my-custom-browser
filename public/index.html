<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Browser</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .browser-card {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #30363d;
        }
        h1 { margin-top: 0; color: #58a6ff; font-size: 24px; }
        p { color: #8b949e; margin-bottom: 25px; }
        .search-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            padding: 12px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
    <div class="browser-card">
        <h1>Custom Web Proxy</h1>
        <p>Enter a URL or search query to browse securely.</p>
        <form class="search-box" id="proxy-form">
            <input type="text" id="url-input" placeholder="https://example.com or search..." required autocomplete="off">
            <button type="submit">Go</button>
        </form>
    </div>

    <!-- Local Ultraviolet Scripts & Config -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const form = document.getElementById('proxy-form');
        const input = document.getElementById('url-input');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            let url = input.value.trim();
            
            // Format URL or search query
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                }
            }

            try {
                // Register service worker correctly at the root path
                if ('serviceWorker' in navigator) {
                    await navigator.serviceWorker.register('/uv/sw.js');
                }

                // Route through the Ultraviolet proxy prefix
                window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
            } catch (err) {
                console.error('Failed to register service worker or proxy URL:', err);
                alert('Error starting proxy session. Check console for details.');
            }
        });
    </script>
</body>
</html>
